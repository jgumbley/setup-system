---
- name: Check whether the Firefox Snap is installed
  tags: firefox
  become: yes
  command: snap list firefox
  register: firefox_snap
  changed_when: false
  failed_when: firefox_snap.rc not in [0, 1]

- name: Remove the Firefox Snap
  tags: firefox
  become: yes
  command: snap remove firefox
  when: firefox_snap.rc == 0

- name: Remove obsolete Mozilla Team PPA configuration
  tags: firefox
  become: yes
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/mozillateam-ppa.list
    - /etc/apt/preferences.d/mozillateam-firefox
    - /etc/apt/keyrings/mozillateam-ppa.asc

- name: Ensure APT keyrings directory exists for Mozilla
  tags: firefox
  become: yes
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Mozilla package signing key over HTTPS
  tags: firefox
  become: yes
  get_url:
    url: https://packages.mozilla.org/apt/repo-signing-key.gpg
    dest: /etc/apt/keyrings/packages.mozilla.org.asc
    mode: '0644'
    checksum: sha256:3ecc63922b7795eb23fdc449ff9396f9114cb3cf186d6f5b53ad4cc3ebfbb11f
    timeout: 60

- name: Configure Mozilla package repository for Firefox
  tags: firefox
  become: yes
  copy:
    dest: /etc/apt/sources.list.d/mozilla.sources
    content: |
      Types: deb
      URIs: https://packages.mozilla.org/apt
      Suites: mozilla
      Components: main
      Signed-By: /etc/apt/keyrings/packages.mozilla.org.asc
    owner: root
    group: root
    mode: '0644'

- name: Prefer Mozilla Firefox packages
  tags: firefox
  become: yes
  copy:
    dest: /etc/apt/preferences.d/mozilla
    content: |
      Package: *
      Pin: origin packages.mozilla.org
      Pin-Priority: 1000
    owner: root
    group: root
    mode: '0644'

- name: Allow unattended upgrades from Mozilla
  tags: firefox
  become: yes
  copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-mozilla
    content: |
      Unattended-Upgrade::Origins-Pattern {
          "site=packages.mozilla.org";
      };
    owner: root
    group: root
    mode: '0644'

- name: Install Mozilla deb Firefox
  tags: firefox
  become: yes
  apt:
    name: firefox
    state: latest
    update_cache: yes
    allow_downgrade: yes

- name: Verify Firefox is installed as a deb
  tags: firefox
  command: dpkg-query -W -f='${Status}' firefox
  register: firefox_deb
  changed_when: false
  failed_when: firefox_deb.stdout != 'install ok installed'

- name: Verify the Mozilla Firefox binary is installed
  tags: firefox
  stat:
    path: /usr/lib/firefox/firefox
  register: firefox_binary
  failed_when: not firefox_binary.stat.exists or not firefox_binary.stat.executable

- name: Verify the Firefox Snap is absent
  tags: firefox
  become: yes
  command: snap list firefox
  register: firefox_snap_check
  changed_when: false
  failed_when: firefox_snap_check.rc != 1

- name: Install Flatpak for Logseq on Rocks
  become: yes
  ansible.builtin.apt:
    name: flatpak
    state: present
    cache_valid_time: 3600
  when: current_hostname == 'rocks'

- name: Add Flathub for Logseq on Rocks
  become: yes
  community.general.flatpak_remote:
    name: flathub
    state: present
    method: system
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo
  when: current_hostname == 'rocks'

- name: Install Logseq on Rocks
  become: yes
  community.general.flatpak:
    name: com.logseq.Logseq
    state: present
    method: system
    remote: flathub
  when: current_hostname == 'rocks'

- name: Install TigerVNC viewer
  tags: vnc-viewer
  become: yes
  apt:
    name: tigervnc-viewer
    state: present

- name: Install sway
  become: yes
  apt:
    name: 
      - 1password
      - sway
      - wayvnc
      - swayidle
      - "{{ 'hyprlock' if current_hostname == 'rocks' else 'swaylock' }}"
      - waybar
      - upower
      - kitty
      - light
      - swaybg
      - wev
      - pavucontrol
      - network-manager
      - brightnessctl
      - wofi
      - grim
      - slurp
      - wtype
      - ydotool
    state: present

- name: Configure Rocks screen locking
  when: current_hostname == 'rocks'
  tags: fingerprint
  block:
    - name: Ensure Hyprlock configuration directory exists
      become: no
      ansible.builtin.file:
        path: ~/.config/hypr
        state: directory
        mode: '0755'

    - name: Configure Hyprlock password and parallel fingerprint authentication
      become: no
      ansible.builtin.copy:
        dest: ~/.config/hypr/hyprlock.conf
        mode: '0644'
        content: |
          # Managed by setup-system.
          general {
              ignore_empty_input = true
          }
          auth {
              pam {
                  enabled = true
                  module = hyprlock
              }
              fingerprint {
                  enabled = true
                  ready_message = Scan fingerprint to unlock
                  present_message = Scanning fingerprint...
              }
          }
          animations {
              enabled = false
          }
          background {
              monitor =
              color = rgb(101018)
          }
          input-field {
              monitor =
              size = 600, 80
              position = 0, 0
              halign = center
              valign = center
              font_family = {{ fixed_font_family }}
              font_color = rgb(eeeeee)
              inner_color = rgb(202030)
              outer_color = rgb(8888aa)
              check_color = rgb(e0b050)
              fail_color = rgb(ff6666)
              capslock_color = rgb(e0b050)
              outline_thickness = 3
              rounding = 8
              fade_on_empty = false
              hide_input = false
              dots_size = 0.3
              dots_spacing = 0.3
              placeholder_text = Password or fingerprint
              fail_text = $PAMFAIL
          }
          label {
              monitor =
              text = $FPRINTPROMPT
              font_family = {{ fixed_font_family }}
              font_size = 18
              color = rgb(eeeeee)
              position = 0, -90
              halign = center
              valign = center
          }

    - name: Ensure local executable directory exists
      become: no
      ansible.builtin.file:
        path: ~/.local/bin
        state: directory
        mode: '0755'

    - name: Install Hyprlock launch and readiness helper
      become: no
      ansible.builtin.copy:
        dest: ~/.local/bin/lock-screen
        mode: '0755'
        content: |
          #!/bin/bash
          # Managed by setup-system. Return to swayidle only after locking.
          set -euo pipefail
          umask 077
          : "${XDG_RUNTIME_DIR:?A graphical user session is required}"
          exec 9>"$XDG_RUNTIME_DIR/hyprlock-start.lock"
          flock 9
          log="$XDG_RUNTIME_DIR/hyprlock.log"
          if pid=$(pgrep -u "$(id -u)" -x hyprlock); then
              [[ "$pid" =~ ^[0-9]+$ ]] || { echo "Multiple Hyprlock processes found" >&2; exit 1; }
          else
              hyprlock --grace 0 --config "$HOME/.config/hypr/hyprlock.conf" >"$log" 2>&1 9>&- &
              pid=$!
          fi
          # Hyprlock 0.9.2 logs this only on the compositor's locked event.
          for ((attempt = 0; attempt < 80; attempt++)); do
              if ! kill -0 "$pid" 2>/dev/null; then
                  cat "$log" >&2
                  exit 1
              fi
              if grep -Fq 'onLockLocked called' "$log"; then
                  exit 0
              fi
              sleep 0.05
          done
          echo "Hyprlock did not confirm the session lock; see $log" >&2
          exit 1

- name: Ensure the sway configuration directory exists
  become: no
  ansible.builtin.file:
    path: ~/.config/sway 
    state: directory
    mode: '0755'

- name: Ensure user environment.d directory exists
  become: no
  ansible.builtin.file:
    path: ~/.config/environment.d
    state: directory
    mode: '0755'

- name: Set wlroots DRM environment flags
  become: no
  ansible.builtin.template:
    src: wlroots.conf.j2
    dest: ~/.config/environment.d/wlroots.conf
    mode: '0644'

- name: Copy sway config
  become: no
  template:
    src: swayconfig.j2
    dest: ~/.config/sway/config
  notify: reload sway

- name: Ensure the waybar configuration directory exists
  become: no
  ansible.builtin.file:
    path: ~/.config/waybar
    state: directory
    mode: '0755'

- name: Include wallpaper tasks
  include_tasks: wallpaper.yml


- name: Copy config 
  become: no
  template:
    src: waybar.j2
    dest: ~/.config/waybar/config.jsonc
  notify: reload sway

- name: Copy waybar style
  become: no
  template:
    src: waybar.css.j2
    dest: ~/.config/waybar/style.css
  notify: reload sway

- name: Create screenshots directory
  become: no
  file:
    path: ~/Pictures/screenshots
    state: directory
    mode: "0755"

- name: Create wallpapers directory
  become: no
  file:
    path: ~/Pictures/wallpapers
    state: directory
    mode: "0755"

- name: Ensure wofi configuration directory exists
  ansible.builtin.file:
    path: ~/.config/wofi
    state: directory
    mode: '0755'

- name: Copy wofi config file
  template:
    src: wofi-config.j2
    dest: ~/.config/wofi/config

- name: Copy wofi style file
  template:
    src: wofi-style.css.j2
    dest: ~/.config/wofi/style.css

- name: Include kanshi tasks
  include_tasks: kanshi.yml

- name: Ensure applications directory exists
  become: no
  ansible.builtin.file:
    path: ~/.local/share/applications
    state: directory
    mode: '0755'

- name: Add Logseq to the Rocks application launcher
  become: no
  ansible.builtin.copy:
    dest: ~/.local/share/applications/com.logseq.Logseq.desktop
    mode: '0644'
    content: |
      [Desktop Entry]
      Name=Logseq
      Comment=A privacy-first platform for knowledge management
      Exec=/usr/bin/flatpak run com.logseq.Logseq
      Icon=/var/lib/flatpak/exports/share/icons/hicolor/scalable/apps/com.logseq.Logseq.svg
      Terminal=false
      Type=Application
      Categories=Office;Utility;
  when: current_hostname == 'rocks'

- name: Add RimWorld launcher (.desktop)
  become: no
  ansible.builtin.template:
    src: rimworld.desktop.j2
    dest: ~/.local/share/applications/rimworld.desktop
    mode: '0644'

- name: Add Xbox controller pairing launcher
  become: no
  ansible.builtin.template:
    src: pair_controller.desktop.j2
    dest: ~/.local/share/applications/pair_controller.desktop
    mode: '0644'
  when: current_hostname == 'rocks'

- name: Configure BlueZ for the Rocks Xbox controller
  ansible.builtin.lineinfile:
    path: /etc/bluetooth/input.conf
    regexp: '^#?ClassicBondedOnly='
    line: 'ClassicBondedOnly=false'
  notify: restart bluetooth
  when: current_hostname == 'rocks'

- name: Grant the Rocks user access to the Xbox controller input device
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/70-xbox-controller.rules
    owner: root
    group: root
    mode: '0644'
    content: |
      SUBSYSTEM=="input", KERNEL=="event*", ATTRS{id/vendor}=="045e", ATTRS{id/product}=="0b05", ENV{ID_INPUT_JOYSTICK}="1", GROUP="users", MODE="0660", TAG+="uaccess"
  notify: reload Xbox controller udev rules
  when: current_hostname == 'rocks'

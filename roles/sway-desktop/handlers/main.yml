---
- name: reload sway
  become: no
  shell: |
    sock=$(ls -1 /run/user/$(id -u)/sway-ipc.*.sock 2>/dev/null | head -n1)
    if [ -n "$sock" ]; then
      swaymsg -s "$sock" reload || true
    else
      echo "No Sway socket found; skipping reload"
    fi

- name: reload kanshi
  become: no
  shell: |
    sock=$(ls -1 /run/user/$(id -u)/sway-ipc.*.sock 2>/dev/null | head -n1)
    if [ -n "$sock" ]; then
      if pgrep -u "$(id -u)" -x kanshi >/dev/null; then
        pkill -u "$(id -u)" -x kanshi
      fi
      swaymsg -s "$sock" exec kanshi
    else
      echo "No Sway socket found; skipping Kanshi reload"
    fi

- name: restart bluetooth
  ansible.builtin.systemd:
    name: bluetooth.service
    state: restarted

- name: reload Xbox controller udev rules
  ansible.builtin.shell: udevadm control --reload-rules && udevadm trigger --subsystem-match=input
  changed_when: true

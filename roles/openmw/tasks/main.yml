---
- name: Ensure add-apt-repository is available for existing desktop OpenMW hosts
  ansible.builtin.apt:
    name: software-properties-common
    state: present
    cache_valid_time: 3600
  become: yes
  when:
    - ansible_facts['hostname'] not in ['holly', 'rocks']
    - ansible_facts['distribution_version'] is version('26.04', '<')

- name: Add OpenMW stable PPA for existing desktop OpenMW hosts
  ansible.builtin.apt_repository:
    repo: ppa:openmw/openmw
    state: present
    update_cache: yes
  become: yes
  when:
    - ansible_facts['hostname'] not in ['holly', 'rocks']
    - ansible_facts['distribution_version'] is version('26.04', '<')

- name: Add OpenMW daily builds PPA for existing desktop OpenMW hosts
  ansible.builtin.apt_repository:
    repo: ppa:openmw/openmw-daily
    state: present
    update_cache: yes
  become: yes
  when:
    - ansible_facts['hostname'] not in ['holly', 'rocks']
    - ansible_facts['distribution_version'] is version('26.04', '<')

- name: Remove obsolete OpenMW PPAs from existing Ubuntu 26.04 desktop hosts
  ansible.builtin.shell: |
    find /etc/apt/sources.list.d -maxdepth 1 -type f \
      \( -name 'openmw-ubuntu-openmw-*.list' \
      -o -name 'openmw-ubuntu-openmw-*.sources' \) \
      -print -delete
  args:
    executable: /bin/bash
  register: openmw_ppa_cleanup
  changed_when: openmw_ppa_cleanup.stdout != ''
  become: yes
  when:
    - ansible_facts['hostname'] != 'holly'
    - ansible_facts['distribution_version'] is version('26.04', '>=')

- name: Install or upgrade OpenMW on existing desktop hosts
  ansible.builtin.apt:
    name:
      - openmw
      - openmw-launcher
      - openmw-cs
      - libopenscenegraph-dev
      - openscenegraph
    state: latest
    cache_valid_time: 3600
  become: yes
  when: ansible_facts['hostname'] not in ['holly', 'rocks']

- name: Install OpenMW source build dependencies
  ansible.builtin.apt:
    name: "{{ openmw_source_build_packages }}"
    state: present
    cache_valid_time: 3600
  become: true

- name: Create the immutable OpenMW runtime parent directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /opt/games
    - "{{ openmw_runtime_root }}"
  become: true
  when: ansible_facts['hostname'] in ['holly', 'rocks']

- name: Build and select the pinned OpenMW runtime
  ansible.builtin.command:
    argv:
      - make
      - --no-print-directory
      - -C
      - "{{ openmw_game_runtimes_utility_dir }}"
      - build-openmw-apply
  register: openmw_runtime_build
  changed_when: "'already installed and exact' not in openmw_runtime_build.stdout"
  become: true
  when: ansible_facts['hostname'] in ['holly', 'rocks']

- name: Remove distro OpenMW packages from Rocks
  ansible.builtin.apt:
    name:
      - openmw
      - openmw-launcher
      - openmw-cs
    state: absent
    purge: true
  become: true
  when: ansible_facts['hostname'] == 'rocks'

- name: Remove the superseded portable OpenMW runtime from Rocks
  ansible.builtin.file:
    path: "{{ openmw_rocks_legacy_runtime_dir }}"
    state: absent
  become: true
  when: ansible_facts['hostname'] == 'rocks'

- name: Create Rocks OpenMW desktop integration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /usr/local/bin
    - /usr/local/share/applications
    - /usr/local/share/pixmaps
  become: true
  when: ansible_facts['hostname'] == 'rocks'

- name: Select the pinned OpenMW commands on Rocks
  ansible.builtin.file:
    src: "{{ openmw_runtime_current }}/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop: "{{ openmw_desktop_commands }}"
  become: true
  when: ansible_facts['hostname'] == 'rocks'

- name: Install pinned OpenMW desktop entries on Rocks
  ansible.builtin.file:
    src: "{{ openmw_runtime_current }}/share/applications/{{ item }}"
    dest: "/usr/local/share/applications/{{ item }}"
    state: link
    force: true
  loop: "{{ openmw_desktop_entries }}"
  become: true
  when: ansible_facts['hostname'] == 'rocks'

- name: Install pinned OpenMW desktop icons on Rocks
  ansible.builtin.file:
    src: "{{ openmw_runtime_current }}/share/pixmaps/{{ item }}"
    dest: "/usr/local/share/pixmaps/{{ item }}"
    state: link
    force: true
  loop: "{{ openmw_desktop_icons }}"
  become: true
  when: ansible_facts['hostname'] == 'rocks'

- name: Create Rocks OpenMW profile directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ openmw_service_user }}"
    group: "{{ openmw_service_group }}"
    mode: "0755"
  loop:
    - "{{ openmw_rocks_config_dir }}"
    - "{{ openmw_rocks_data_local_dir }}"
  become: true
  when: ansible_facts['hostname'] == 'rocks'

- name: Manage Rocks OpenMW content configuration
  ansible.builtin.template:
    src: openmw.cfg.j2
    dest: "{{ openmw_rocks_config_dir }}/openmw.cfg"
    owner: "{{ openmw_service_user }}"
    group: "{{ openmw_service_group }}"
    mode: "0644"
  vars:
    openmw_profile_data_local_dir: "{{ openmw_rocks_data_local_dir }}"
  become: true
  when: ansible_facts['hostname'] == 'rocks'

- name: Create OpenMW writable game directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ openmw_service_user }}"
    group: "{{ openmw_service_group }}"
    mode: "0700"
  loop:
    - /var/lib/sunshine-host
    - /var/lib/sunshine-host/games
    - "{{ openmw_morrowind_state_root }}"
    - "{{ openmw_morrowind_native_root }}"
    - "{{ openmw_morrowind_native_config_dir }}"
    - "{{ openmw_morrowind_native_user_data_dir }}"
    - "{{ openmw_morrowind_native_data_local_dir }}"
    - "{{ openmw_morrowind_rocknix_root }}"
    - "{{ openmw_morrowind_rocknix_config_dir }}"
    - "{{ openmw_morrowind_rocknix_user_data_dir }}"
    - "{{ openmw_morrowind_rocknix_data_local_dir }}"
    - /var/cache/sunshine-host
    - "{{ openmw_games_cache_dir }}"
  become: true
  when: ansible_facts['hostname'] == 'holly'

- name: Seed the native OpenMW profile when configuration is absent
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ openmw_morrowind_native_config_dir }}/{{ item.dest }}"
    owner: "{{ openmw_service_user }}"
    group: "{{ openmw_service_group }}"
    mode: "0640"
    force: false
  loop:
    - src: openmw.cfg.j2
      dest: openmw.cfg
    - src: settings.cfg.j2
      dest: settings.cfg
  become: true
  when: ansible_facts['hostname'] == 'holly'

- name: Remove the previous native OpenMW video seed
  ansible.builtin.replace:
    path: "{{ openmw_morrowind_native_config_dir }}/settings.cfg"
    regexp: '(?m)^\[Video\]\nresolution x = 1920\nresolution y = 1080\nwindow mode = 1\nvsync mode = 1\nframerate limit = 60\n\n'
    replace: ''
  become: true
  when: ansible_facts['hostname'] == 'holly'

- name: Manage the native OpenMW graphics profile
  ansible.builtin.blockinfile:
    path: "{{ openmw_morrowind_native_config_dir }}/settings.cfg"
    marker: "# {mark} setup-system OpenMW graphics"
    block: "{{ openmw_morrowind_native_graphics_settings }}"
    owner: "{{ openmw_service_user }}"
    group: "{{ openmw_service_group }}"
    mode: "0640"
  become: true
  when: ansible_facts['hostname'] == 'holly'

# Preserve the existing Morrowind content-authoring environment. It is separate
# from the explicitly invoked game runtime build and remains setup-managed.
- name: Install Morrowind content creation toolchain (apt)
  ansible.builtin.apt:
    name:
      - blender
      - dosbox
      - gimp
      - audacity
    state: present
    cache_valid_time: 3600
  become: yes

- name: Read the installed Blender version
  ansible.builtin.command: blender --version
  register: blender_version
  changed_when: false
  become: yes
  become_user: system

- name: Select Blender add-on releases
  ansible.builtin.set_fact:
    blender_config_version: "{{ blender_version.stdout | regex_search('Blender ([0-9]+\\.[0-9]+)', '\\1') | first }}"
    comfyui_blender_version: "{{ 'v4.5.0' if blender_version.stdout is search('Blender ([5-9]|[1-9][0-9]+)\\.') else 'v3.3.4' }}"
    comfyui_blender_checksum: "{{ '349bb6c08bc0be41969cd589d77732c2dde5ad364de78b2af470de73a8501ce1' if blender_version.stdout is search('Blender ([5-9]|[1-9][0-9]+)\\.') else 'a1492de6b15ba9c7f3b6d7b631dd25fcaa6c590896817f34cdc53798160347cd' }}"

- name: Create Blender add-on and download directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "0755"
  loop:
    - path: "/home/system/.config/blender/{{ blender_config_version }}/scripts/addons"
      owner: system
      group: system
    - path: /var/cache/setup-system/blender-addons
      owner: root
      group: root
  become: yes

- name: Download the Morrowind Blender plug-in
  ansible.builtin.get_url:
    url: https://github.com/Greatness7/io_scene_mw/releases/download/0.8.120/io_scene_mw.zip
    dest: /var/cache/setup-system/blender-addons/io_scene_mw-0.8.120.zip
    checksum: sha256:351734f08186202b0c9e8433bb6e9fa4d4f29b0e440a098da6ef37904a53ace9
    mode: "0644"
  become: yes

- name: Download the Blender ComfyUI integration
  ansible.builtin.get_url:
    url: "https://github.com/alexisrolland/ComfyUI-Blender/releases/download/{{ comfyui_blender_version }}/comfyui_blender_{{ comfyui_blender_version }}.zip"
    dest: "/var/cache/setup-system/blender-addons/comfyui_blender-{{ comfyui_blender_version }}.zip"
    checksum: "sha256:{{ comfyui_blender_checksum }}"
    mode: "0644"
  become: yes

- name: Check installed Blender add-on versions
  ansible.builtin.stat:
    path: "/home/system/.config/blender/{{ blender_config_version }}/scripts/addons/{{ item.directory }}/.setup-system-{{ item.version }}"
  loop:
    - directory: io_scene_mw
      version: 0.8.120
    - directory: comfyui_blender
      version: "{{ comfyui_blender_version }}"
  register: blender_addon_versions
  become: yes

- name: Remove superseded Blender add-ons
  ansible.builtin.file:
    path: "/home/system/.config/blender/{{ blender_config_version }}/scripts/addons/{{ item.item.directory }}"
    state: absent
  loop: "{{ blender_addon_versions.results }}"
  when: not item.stat.exists
  become: yes

- name: Install Blender add-ons
  ansible.builtin.unarchive:
    src: "/var/cache/setup-system/blender-addons/{{ item.archive }}"
    dest: "/home/system/.config/blender/{{ blender_config_version }}/scripts/addons"
    remote_src: yes
    owner: system
    group: system
    creates: "/home/system/.config/blender/{{ blender_config_version }}/scripts/addons/{{ item.directory }}/.setup-system-{{ item.version }}"
  loop:
    - archive: io_scene_mw-0.8.120.zip
      directory: io_scene_mw
      version: 0.8.120
    - archive: "comfyui_blender-{{ comfyui_blender_version }}.zip"
      directory: comfyui_blender
      version: "{{ comfyui_blender_version }}"
  become: yes

- name: Record installed Blender add-on versions
  ansible.builtin.file:
    path: "/home/system/.config/blender/{{ blender_config_version }}/scripts/addons/{{ item.directory }}/.setup-system-{{ item.version }}"
    state: touch
    owner: system
    group: system
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  loop:
    - directory: io_scene_mw
      version: 0.8.120
    - directory: comfyui_blender
      version: "{{ comfyui_blender_version }}"
  become: yes

- name: Enable the OpenMW and ComfyUI Blender add-ons
  ansible.builtin.command:
    argv:
      - blender
      - --background
      - --python-expr
      - "import bpy; [bpy.ops.preferences.addon_enable(module=module) for module in ('io_scene_mw', 'comfyui_blender')]; bpy.ops.wm.save_userpref()"
  changed_when: false
  become: yes
  become_user: system

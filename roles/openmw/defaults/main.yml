---
openmw_service_user: system
openmw_service_group: system

# Rocks and Holly share this pinned runtime location. The role invokes the
# Make-owned runtime builder and keeps the selected link exact.
openmw_runtime_root: /opt/games/openmw
openmw_runtime_current: "{{ openmw_runtime_root }}/current"
openmw_resources_dir: "{{ openmw_runtime_current }}/share/games/openmw/resources"
openmw_game_runtimes_utility_dir: "{{ playbook_dir }}/utils/game_runtimes"

openmw_rocks_config_dir: /home/system/.config/openmw
openmw_rocks_data_local_dir: /home/system/.local/share/openmw/data
openmw_rocks_legacy_runtime_dir: /opt/openmw-0.51.0-Linux-64Bit
openmw_desktop_commands:
  - openmw
  - openmw-launcher
  - openmw-cs
openmw_desktop_entries:
  - org.openmw.launcher.desktop
  - org.openmw.cs.desktop
openmw_desktop_icons:
  - openmw.png
  - openmw-cs.png

openmw_games_cache_dir: /var/cache/sunshine-host/games
openmw_morrowind_state_root: /var/lib/sunshine-host/games/morrowind
openmw_morrowind_native_root: "{{ openmw_morrowind_state_root }}/native"
openmw_morrowind_native_config_dir: "{{ openmw_morrowind_native_root }}/config"
openmw_morrowind_native_user_data_dir: "{{ openmw_morrowind_native_root }}/user-data"
openmw_morrowind_native_data_local_dir: "{{ openmw_morrowind_native_root }}/data-local"
openmw_profile_data_local_dir: "{{ openmw_morrowind_native_data_local_dir }}"
openmw_morrowind_rocknix_root: "{{ openmw_morrowind_state_root }}/rocknix"
openmw_morrowind_rocknix_config_dir: "{{ openmw_morrowind_rocknix_root }}/config"
openmw_morrowind_rocknix_user_data_dir: "{{ openmw_morrowind_rocknix_root }}/user-data"
openmw_morrowind_rocknix_data_local_dir: "{{ openmw_morrowind_rocknix_root }}/data-local"

openmw_morrowind_data_dir: /mnt/iceburg/roms/ports/openmw/Data Files
openmw_morrowind_julan_data_dir: /mnt/iceburg/roms/ports/openmw/lm_plugins/Julan
openmw_morrowind_katisha_data_dir: /mnt/iceburg/roms/ports/openmw/lm_plugins/Katisha/Data Files

openmw_morrowind_native_graphics_settings: |
  [Video]
  resolution x = 1920
  resolution y = 1080
  window mode = 1
  vsync mode = 1
  framerate limit = 60
  antialiasing = 8

  [General]
  anisotropy = 16

  [Camera]
  viewing distance = 32768

  [Terrain]
  distant terrain = true
  object paging = true
  object paging active grid = true
  composite map resolution = 1024

  [Shaders]
  lighting method = shaders
  max lights = 32

  [Shadows]
  enable shadows = true
  number of shadow maps = 4
  maximum shadow map distance = 16384
  shadow map resolution = 4096
  actor shadows = true
  player shadows = true
  terrain shadows = true
  object shadows = true
  enable indoor shadows = false

  [Water]
  shader = true
  rtt size = 2048
  refraction = true
  reflection detail = 4

openmw_source_build_packages:
  - build-essential
  - ccache
  - cmake
  - curl
  - git
  - mold
  - ninja-build
  - pkg-config
  - unzip
  - libavcodec-dev
  - libavformat-dev
  - libavutil-dev
  - libboost-iostreams-dev
  - libboost-program-options-dev
  - libbullet-dev
  - libcollada-dom-dev
  - libicu-dev
  - libjpeg-dev
  - libluajit-5.1-dev
  - liblz4-dev
  - libmygui-dev
  - libopenal-dev
  - libopenscenegraph-dev
  - libpng-dev
  - librecast-dev
  - libsdl2-dev
  - libsqlite3-dev
  - libswresample-dev
  - libswscale-dev
  - libtinyxml-dev
  - libunshield-dev
  - libyaml-cpp-dev
  - qt6-base-dev
  - qt6-svg-dev
  - qt6-tools-dev
  - qt6-tools-dev-tools

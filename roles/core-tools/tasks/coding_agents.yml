---
- name: Check for npm availability
  command: npm --version
  register: npm_check
  changed_when: false
  failed_when: false

- name: Fail if npm is not available
  fail:
    msg: >-
      npm is not available on PATH. Node.js installation should provide npm,
      but it appears missing. Please review Node.js install tasks for this host.
  when: npm_check.rc != 0

- name: Install/Update Claude Code globally
  npm:
    name: "@anthropic-ai/claude-code"
    global: yes
    state: latest
  become: "{{ ansible_facts['os_family'] != 'Darwin' }}"
  register: claude_install_result

- name: Install/Update OpenAI Codex globally
  npm:
    name: "@openai/codex"
    global: yes
    state: latest
  become: "{{ ansible_facts['os_family'] != 'Darwin' }}"

- name: Remove deprecated @mariozechner/pi-coding-agent package
  npm:
    name: "@mariozechner/pi-coding-agent"
    global: yes
    state: absent
  become: "{{ ansible_facts['os_family'] != 'Darwin' }}"

- name: Install/Update Pi Coding Agent globally
  npm:
    name: "@earendil-works/pi-coding-agent"
    global: yes
    state: latest
  become: "{{ ansible_facts['os_family'] != 'Darwin' }}"
  register: pi_install_result

- name: Install/Update OpenCode AI globally
  npm:
    name: "opencode-ai"
    global: yes
    state: latest
  become: "{{ ansible_facts['os_family'] != 'Darwin' }}"
  register: opencode_install_result

- name: Remove npm-installed Hunk
  npm:
    name: "hunkdiff"
    global: yes
    state: absent
  become: "{{ ansible_facts['os_family'] != 'Darwin' }}"

- name: Install/Update Hunk from its verified release archive
  shell: |
    set -o pipefail
    curl -fsSL https://hunk.dev/install.sh | sh -s -- --no-modify-path
  args:
    executable: /bin/bash
  environment:
    HUNK_INSTALL_DIR: /usr/local/lib/hunk
  become: yes
  register: hunk_install_result
  changed_when: "'Installed hunk' in hunk_install_result.stdout"

- name: Link Hunk into PATH
  file:
    src: /usr/local/lib/hunk/hunk
    dest: /usr/local/bin/hunk
    state: link
    force: yes
  become: yes

- name: Verify Hunk
  command: /usr/local/bin/hunk --version
  changed_when: false

- name: Display Claude Code installation status
  debug:
    msg: "Claude Code {{ 'updated' if claude_install_result.changed else 'already up to date' }}"

- name: Display OpenCode AI installation status
  debug:
    msg: "OpenCode AI {{ 'updated' if opencode_install_result.changed else 'already up to date' }}"

- name: Display Hunk installation status
  debug:
    msg: "Hunk {{ 'updated' if hunk_install_result.changed else 'already up to date' }}"

- name: Display Pi Coding Agent installation status
  debug:
    msg: "Pi Coding Agent {{ 'updated' if pi_install_result.changed else 'already up to date' }}"

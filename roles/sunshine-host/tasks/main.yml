---
- name: Require Holly's supported Sunshine Host platform
  ansible.builtin.assert:
    that:
      - ansible_facts['hostname'] == 'holly'
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_version'] == '26.04'
      - ansible_facts['architecture'] in ['x86_64', 'amd64']
      - sunshine_host_workspace_root is match('^/')
    fail_msg: >-
      The sunshine-host role only supports Holly on Ubuntu 26.04 amd64 with
      fully qualified workspace locations; detected {{ ansible_facts['hostname'] }}
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
      {{ ansible_facts['architecture'] }}.

# Headless host: Plymouth's splash never hands off to gdm when the GPU has no
# connected CRTC ("amdgpu: Cannot find any crtc or sizes"), so plymouthd stays
# attached and plymouth-quit-wait.service (TimeoutSec=0) blocks the boot
# transaction indefinitely, stalling multi-user/graphical.target and anything
# ordered after them (e.g. sunshine-host.target). Removing "splash" from the
# kernel cmdline keeps plymouth-start from ever running (its unit has
# ConditionKernelCommandLine=splash), eliminating the whole failure class.
# The headless Navi31 GPU must also remain awake: its firmware cannot recover
# from runtime suspend, leaving renderD128 unusable and Sunshine video blank.
- name: Configure Holly's headless GPU kernel command line
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
    line: 'GRUB_CMDLINE_LINUX_DEFAULT="quiet amdgpu.runpm=0"'
  become: yes
  register: sunshine_host_grub_cmdline
  tags: plymouth

- name: Regenerate GRUB configuration
  ansible.builtin.command: update-grub
  become: yes
  when: sunshine_host_grub_cmdline is changed
  tags: plymouth

- name: Check whether Plymouth is currently running
  ansible.builtin.command: plymouth --ping
  become: yes
  register: sunshine_host_plymouth_ping
  changed_when: false
  failed_when: sunshine_host_plymouth_ping.rc not in [0, 1]
  when: sunshine_host_grub_cmdline is changed
  tags: plymouth

- name: Release the current Plymouth boot wait
  ansible.builtin.command: plymouth quit
  become: yes
  when:
    - sunshine_host_grub_cmdline is changed
    - sunshine_host_plymouth_ping.rc == 0
  tags: plymouth

- name: Create setup-system package cache
  ansible.builtin.file:
    path: /var/cache/setup-system
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download the pinned Sunshine Ubuntu package
  ansible.builtin.get_url:
    url: "{{ sunshine_host_deb_url }}"
    dest: "{{ sunshine_host_deb_path }}"
    checksum: "sha256:{{ sunshine_host_deb_sha256 }}"
    owner: root
    group: root
    mode: '0644'

- name: Install Sunshine as an operating-system package
  ansible.builtin.apt:
    deb: "{{ sunshine_host_deb_path }}"
    state: present
  notify: Sunshine Host configuration changed

- name: Install Sunshine Host runtime and utility packages
  ansible.builtin.apt:
    name:
      - curl
      - dbus
      - docker.io
      - fonts-dejavu-core
      - foot
      - build-essential
      - iproute2
      - jq
      - kitty
      - libasound2-dev
      - libcurl4-openssl-dev
      - libsdl2-dev
      - libxrandr-dev
      - libxxf86dga-dev
      - libxxf86vm-dev
      - make
      - mesa-common-dev
      - openssl
      - patch
      - pkg-config
      - pulseaudio-utils
      - python3
      - python3-pil
      - rsync
      - seatd
      - sway
      - tmux
    state: present
    cache_valid_time: 3600

- name: Enable and start the ROCKNIX container runtime
  ansible.builtin.systemd:
    name: docker
    enabled: yes
    state: started

- name: Verify the native Sunshine binary
  ansible.builtin.command: "{{ sunshine_host_bin }} --version"
  register: sunshine_host_version_output
  changed_when: false
  failed_when: >-
    sunshine_host_version_output.rc != 0 or
    sunshine_host_version not in
    (sunshine_host_version_output.stdout ~ sunshine_host_version_output.stderr)

- name: Load uinput kernel module for Sunshine
  ansible.builtin.modprobe:
    name: uinput
    state: present

- name: Load uinput kernel module at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/uinput.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      uinput

- name: Ensure input group exists for Sunshine
  ansible.builtin.group:
    name: input
    state: present

- name: Add Sunshine service user to host device groups
  ansible.builtin.user:
    name: "{{ sunshine_host_user }}"
    groups: input,render,video,audio,docker
    append: yes
  notify: Sunshine Host configuration changed

- name: Enable and start seatd service
  ansible.builtin.systemd:
    name: seatd
    enabled: yes
    state: started

- name: Remove legacy local Sunshine uinput rule
  ansible.builtin.file:
    path: /etc/udev/rules.d/85-sunshine-uinput.rules
    state: absent
  register: sunshine_host_uinput_rules

- name: Reload package-owned Sunshine udev rules
  ansible.builtin.command: udevadm control --reload-rules
  when: sunshine_host_uinput_rules.changed

- name: Apply package-owned Sunshine uinput rule
  ansible.builtin.command: udevadm trigger --sysname-match=uinput
  when: sunshine_host_uinput_rules.changed

- name: Ensure live uinput device uses Sunshine group ownership
  ansible.builtin.file:
    path: /dev/uinput
    owner: root
    group: input
    mode: '0660'

- name: Create Sunshine Host system directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ sunshine_host_group }}"
    mode: '0755'
  loop:
    - "{{ sunshine_host_install_dir }}"
    - "{{ sunshine_host_install_dir }}/bin"
    - "{{ sunshine_host_config_dir }}"
    - "{{ sunshine_host_config_dir }}/covers"
    - "{{ sunshine_host_config_dir }}/sway"

- name: Create private persistent Sunshine Host state directory
  ansible.builtin.file:
    path: "{{ sunshine_host_state_dir }}"
    state: directory
    owner: "{{ sunshine_host_user }}"
    group: "{{ sunshine_host_group }}"
    mode: '0700'

- name: Create private local game state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ sunshine_host_user }}"
    group: "{{ sunshine_host_group }}"
    mode: '0700'
  loop:
    - "{{ sunshine_host_game_state_dir }}"
    - "{{ sunshine_host_quake3_home_dir }}"
    - "{{ sunshine_host_quake3_home_dir }}/baseq3"
    - "{{ sunshine_host_rocknix_state_dir }}"
    - "{{ sunshine_host_rocknix_state_dir }}/.config"
    - "{{ sunshine_host_rocknix_state_dir }}/.cache"
    - "{{ sunshine_host_rocknix_state_dir }}/.cache/logs"
    - "{{ sunshine_host_rocknix_state_dir }}/.local"
    - "{{ sunshine_host_rocknix_state_dir }}/.local/share"
    - "{{ sunshine_host_rocknix_state_dir }}/.local/share/locale"
    - "{{ sunshine_host_rocknix_state_dir }}/joypads"
    - "{{ sunshine_host_rocknix_state_dir }}/saves"
    - "{{ sunshine_host_rocknix_state_dir }}/states"
    - "{{ sunshine_host_rocknix_state_dir }}/screenshots"

- name: Install managed Quake III controller configuration
  ansible.builtin.copy:
    src: "{{ sunshine_host_game_runtimes_utility_dir }}/autoexec.cfg"
    dest: "{{ sunshine_host_quake3_home_dir }}/{{ sunshine_host_quake3_basegame }}/autoexec.cfg"
    owner: "{{ sunshine_host_user }}"
    group: "{{ sunshine_host_group }}"
    mode: '0600'
    force: yes

- name: Install managed ROCKNIX Sunshine controller profile
  ansible.builtin.copy:
    dest: "{{ sunshine_host_rocknix_state_dir }}/joypads/sunshine-retroarch.cfg"
    owner: "{{ sunshine_host_user }}"
    group: "{{ sunshine_host_group }}"
    mode: '0600'
    force: yes
    content: |
      # Moonlight controller forwarded by Sunshine with gamepad=xone.
      input_driver = "udev"
      input_device = "Sunshine X-Box One (virtual) pad"
      input_device_display_name = "Moonlight Xbox Controller"
      input_vendor_id = "1118"
      input_product_id = "746"
      input_b_btn = "0"
      input_y_btn = "2"
      input_select_btn = "6"
      input_start_btn = "7"
      input_up_btn = "h0up"
      input_down_btn = "h0down"
      input_left_btn = "h0left"
      input_right_btn = "h0right"
      input_a_btn = "1"
      input_x_btn = "3"
      input_l_btn = "4"
      input_r_btn = "5"
      input_l2_axis = "+2"
      input_r2_axis = "+5"
      input_l3_btn = "9"
      input_r3_btn = "10"
      input_l_x_plus_axis = "+0"
      input_l_x_minus_axis = "-0"
      input_l_y_plus_axis = "+1"
      input_l_y_minus_axis = "-1"
      input_r_x_plus_axis = "+3"
      input_r_x_minus_axis = "-3"
      input_r_y_plus_axis = "+4"
      input_r_y_minus_axis = "-4"
      input_menu_toggle_btn = "8"
      input_b_btn_label = "A"
      input_y_btn_label = "X"
      input_select_btn_label = "Back"
      input_start_btn_label = "Start"
      input_up_btn_label = "D-Pad Up"
      input_down_btn_label = "D-Pad Down"
      input_left_btn_label = "D-Pad Left"
      input_right_btn_label = "D-Pad Right"
      input_a_btn_label = "B"
      input_x_btn_label = "Y"
      input_l_btn_label = "LB"
      input_r_btn_label = "RB"
      input_l2_axis_label = "LT"
      input_r2_axis_label = "RT"
      input_l3_btn_label = "Left Thumb"
      input_r3_btn_label = "Right Thumb"
      input_l_x_plus_axis_label = "Left Analog Right"
      input_l_x_minus_axis_label = "Left Analog Left"
      input_l_y_plus_axis_label = "Left Analog Down"
      input_l_y_minus_axis_label = "Left Analog Up"
      input_r_x_plus_axis_label = "Right Analog Right"
      input_r_x_minus_axis_label = "Right Analog Left"
      input_r_y_plus_axis_label = "Right Analog Down"
      input_r_y_minus_axis_label = "Right Analog Up"
      input_menu_toggle_btn_label = "Guide"

- name: Create rebuildable local game cache directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ sunshine_host_user }}"
    group: "{{ sunshine_host_group }}"
    mode: '0700'
  loop:
    - "{{ sunshine_host_game_cache_dir }}"
    - "{{ sunshine_host_game_cache_dir }}/morrowind"
    - "{{ sunshine_host_game_cache_dir }}/morrowind/native"
    - "{{ sunshine_host_game_cache_dir }}/morrowind/rocknix"
    - "{{ sunshine_host_game_cache_dir }}/quake3"
    - "{{ sunshine_host_game_cache_dir }}/rocknix"

- name: Generate private Sunshine web-manager credential
  ansible.builtin.shell:
    cmd: >-
      umask 077 &&
      openssl rand -hex 32 > "{{ sunshine_host_state_dir }}/web-manager-password"
    creates: "{{ sunshine_host_state_dir }}/web-manager-password"
  become: true
  become_user: "{{ sunshine_host_user }}"
  register: sunshine_host_web_manager_credential

- name: Inspect Sunshine managed state
  ansible.builtin.stat:
    path: "{{ sunshine_host_state_dir }}/sunshine_state.json"
  register: sunshine_host_managed_state

- name: Install Sunshine Host launchers
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ sunshine_host_install_dir }}/bin/{{ item.dest }}"
    owner: root
    group: "{{ sunshine_host_group }}"
    mode: '0755'
  loop:
    - src: game-session.sh.j2
      dest: game-session.sh
    - src: run-morrowind-openmw.sh.j2
      dest: run-morrowind-openmw.sh
    - src: run-quake3.sh.j2
      dest: run-quake3.sh
    - src: quest-philby-app.sh.j2
      dest: quest-philby-app.sh
    - src: quest-camera-app.sh.j2
      dest: quest-camera-app.sh
    - src: run-rocknix.sh.j2
      dest: run-rocknix.sh
    - src: quest-ready-terminal.sh.j2
      dest: quest-ready-terminal.sh
  notify: Sunshine Host configuration changed

- name: Install Sunshine Host camera share-link placeholder
  ansible.builtin.copy:
    dest: "{{ sunshine_host_state_dir }}/camera.env"
    owner: "{{ sunshine_host_user }}"
    group: "{{ sunshine_host_group }}"
    mode: '0600'
    force: no
    content: |
      # UniFi camera share link. Local secret: never commit to git.
      # Create/copy the share link from UniFi Protect > Camera > Share,
      # then uncomment:
      # CAMERA_SHARE_URL=https://monitor.ui.com/your-share-id

- name: Install Sunshine Host socket readiness helper
  ansible.builtin.copy:
    src: "{{ sunshine_host_utility_dir }}/wait-runtime-sockets.sh"
    dest: "{{ sunshine_host_install_dir }}/bin/wait-runtime-sockets.sh"
    owner: root
    group: "{{ sunshine_host_group }}"
    mode: '0755'
  notify: Sunshine Host configuration changed

- name: Install Sunshine Host cover art
  ansible.builtin.copy:
    src: "{{ sunshine_host_utility_dir }}/covers/{{ item }}.png"
    dest: "{{ sunshine_host_config_dir }}/covers/{{ item }}.png"
    owner: root
    group: "{{ sunshine_host_group }}"
    mode: preserve
  loop:
    - philby
    - camera
    - morrowind
    - quake3
    - rocknix
    - steam
  notify: Sunshine Host configuration changed

- name: Install Sunshine Host configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: "{{ sunshine_host_group }}"
    mode: "{{ item.mode }}"
  loop:
    - src: sway.conf.j2
      dest: "{{ sunshine_host_config_dir }}/sway/sway.conf"
      mode: '0644'
    - src: apps.json.j2
      dest: "{{ sunshine_host_config_dir }}/apps.json"
      mode: '0644'
    - src: sunshine.conf.j2
      dest: "{{ sunshine_host_config_dir }}/sunshine.conf"
      mode: '0640'
  notify: Sunshine Host configuration changed

- name: Remove obsolete Sunshine-local utility locations
  ansible.builtin.file:
    path: "{{ sunshine_host_config_dir }}/locations.mk"
    state: absent

- name: Install Sunshine Host systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - sunshine-host-sway.service
    - sunshine-host-sunshine.service
    - sunshine-host.target
  notify: Sunshine Host configuration changed

- name: Remove obsolete Sunshine Host launchers
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ sunshine_host_install_dir }}/bin/run-eaadwig-openmw.sh"
    - "{{ sunshine_host_config_dir }}/covers/eaadwig.png"
    - "{{ sunshine_host_install_dir }}/bin/run-doom3.sh"
    - "{{ sunshine_host_install_dir }}/bin/quest-tmux-app.sh"
  notify: Sunshine Host configuration changed

- name: Reload systemd after installing Sunshine Host units
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Stop the Sunshine stack before applying its new web-manager credential
  ansible.builtin.systemd:
    name: sunshine-host.target
    state: stopped
  when: >-
    sunshine_host_web_manager_credential.changed or
    not sunshine_host_managed_state.stat.exists

- name: Apply the generated Sunshine web-manager credential
  ansible.builtin.shell:
    cmd: >-
      password="$(cat "{{ sunshine_host_state_dir }}/web-manager-password")" &&
      exec "{{ sunshine_host_bin }}"
      "{{ sunshine_host_config_dir }}/sunshine.conf"
      --creds sunshine "$password"
  environment:
    HOME: "{{ sunshine_host_state_dir }}"
  become: true
  become_user: "{{ sunshine_host_user }}"
  no_log: true
  when: >-
    sunshine_host_web_manager_credential.changed or
    not sunshine_host_managed_state.stat.exists

- name: Keep Sunshine managed state private
  ansible.builtin.file:
    path: "{{ sunshine_host_state_dir }}/sunshine_state.json"
    state: file
    owner: "{{ sunshine_host_user }}"
    group: "{{ sunshine_host_group }}"
    mode: '0600'

- name: Disable direct Sunshine Host child-unit enablement
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: no
  loop:
    - sunshine-host-sway.service
    - sunshine-host-sunshine.service

- name: Enable and start coordinated Sunshine Host target
  ansible.builtin.systemd:
    name: sunshine-host.target
    enabled: yes
    state: started
